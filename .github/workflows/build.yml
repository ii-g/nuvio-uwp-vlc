name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Check web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          # 22+ recognises ES module syntax in plain .js files.
          node-version: 22
      - name: Syntax check
        run: |
          # The web app has no build step; make sure every module at least parses. Parsed from
          # stdin as modules, since `node --check file.js` can pass a broken file it can't classify.
          find web/js web/dev tools -name '*.js' -o -name '*.mjs' | while read -r file; do
            node --input-type=module --check < "$file" || { echo "::error file=$file::Syntax error"; exit 1; }
          done
          echo "$(find web/js -name '*.js' | wc -l) web modules OK"

  guard:
    name: Guard deleted code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fail if banned identifiers return
        run: |
          # Deleted frame code must never come back. Word boundaries (\b) so the
          # live SidebarBackdropBlurBrush does not trip the BackdropBlurBrush ban.
          # Only source is scanned (Nuvio/, web/) — the pattern list itself lives
          # in this workflow file, so .github/ is never searched.
          pattern='\b(RotatingFrameLight|FocusRingBrush|FocusFrameGradientBrush|FocusGlassBand|FocusInnerRing|FocusShineStop|UniformSpeed|RestartOnFocus|RestartSubscription|FocusSheen|GlobalFocusOverlay|GraduatedBackdropBlurBrush|BackdropBlurBrush)\b'
          if grep -rE --include='*.cs' --include='*.xaml' --include='*.csproj' --include='*.js' --include='*.xml' "$pattern" Nuvio web; then
            echo "::error::Banned identifier found — deleted frame code came back. See matches above."
            exit 1
          fi
          echo 'Guard clean: no banned identifiers in Nuvio/ or web/.'

  commit-rules:
    name: Commit message rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Enforce one-line messages without personal info
        run: |
          before='${{ github.event.before }}'
          if [ -z "$before" ] || [ "$before" = '0000000000000000000000000000000000000000' ]; then
            shas=$(git rev-list -1 HEAD)
          else
            shas=$(git rev-list "$before..HEAD")
          fi
          failed=0
          for sha in $shas; do
            msg=$(git log -1 --format=%B "$sha")
            lines=$(printf '%s\n' "$msg" | wc -l)
            if [ "$lines" -gt 1 ]; then
              echo "::error::Commit $sha has a multi-line message (must be one line)."
              failed=1
            fi
            if printf '%s' "$msg" | grep -qiE 'mohammed|محمد'; then
              echo "::error::Commit $sha mentions a personal name (not allowed in commit messages)."
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo 'Commit messages OK.'

  package:
    name: Package (${{ matrix.configuration }})
    needs: [web, guard, commit-rules]
    runs-on: windows-2022
    permissions:
      contents: write # publish releases for version tags
    strategy:
      fail-fast: false
      matrix:
        # Release is the one to install. Debug skips .NET Native, which helps tell a
        # compiler problem from an app problem if a Release build misbehaves.
        configuration: [Release, Debug]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - uses: microsoft/setup-msbuild@v3

      - name: Set package version
        shell: pwsh
        run: |
          $manifest = Resolve-Path 'Nuvio\Package.appxmanifest'
          [xml]$xml = Get-Content $manifest -Raw
          # Major and minor from the manifest, then the run number: always increasing, so a newer
          # build installs over an older one. Local builds keep 0 there, which the app treats as a
          # developer build that doesn't look for updates.
          $base = [version]$xml.Package.Identity.Version
          $version = "$($base.Major).$($base.Minor).$env:GITHUB_RUN_NUMBER.0"
          $xml.Package.Identity.Version = $version
          $xml.Save($manifest)
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          "Version: $version"

      - name: Create signing certificate
        shell: pwsh
        run: |
          # Self-signed, subject must match Publisher in Package.appxmanifest.
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Mg18' `
            -KeyUsage DigitalSignature -FriendlyName 'Nuvio UWP sideload' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Add build settings
        # Optional repository secrets, written into web/js/config.local.js (never committed):
        # NUVIO_PUBLISHABLE_KEY builds in a Nuvio server to sign in to (NUVIO_BACKEND_URL,
        # default https://api.nuvio.tv), TMDB_API_KEY a TMDB key for artwork and cast, and
        # TRAKT_CLIENT_ID + TRAKT_CLIENT_SECRET the Trakt API app to connect Trakt with.
        shell: pwsh
        env:
          NUVIO_PUBLISHABLE_KEY: ${{ secrets.NUVIO_PUBLISHABLE_KEY }}
          NUVIO_BACKEND_URL: ${{ secrets.NUVIO_BACKEND_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          $config = [ordered]@{}
          if ($env:NUVIO_PUBLISHABLE_KEY) {
            $url = if ($env:NUVIO_BACKEND_URL) { $env:NUVIO_BACKEND_URL } else { 'https://api.nuvio.tv' }
            $config.officialServer = [ordered]@{ backendUrl = $url; publishableKey = $env:NUVIO_PUBLISHABLE_KEY }
          }
          if ($env:TMDB_API_KEY) { $config.tmdbApiKey = $env:TMDB_API_KEY }
          if ($env:TRAKT_CLIENT_ID -and $env:TRAKT_CLIENT_SECRET) {
            $config.trakt = [ordered]@{ clientId = $env:TRAKT_CLIENT_ID; clientSecret = $env:TRAKT_CLIENT_SECRET }
          }
          if ($config.Count) {
            "export default $($config | ConvertTo-Json -Compress -Depth 3);" | Set-Content web\js\config.local.js -Encoding utf8
            "Build settings added: $($config.Keys -join ', ')"
          } else {
            'No build overrides: sign-in defaults to the official Nuvio server.'
          }

      - name: Build package
        shell: pwsh
        run: >
          msbuild Nuvio\Nuvio.csproj -restore -m -nologo -v:minimal
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=x64
          /p:AppxBundle=Never
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxAutoIncrementPackageRevision=false
          /p:AppxPackageDir=$env:GITHUB_WORKSPACE\AppPackages\
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT

      - name: Verify package
        shell: pwsh
        run: |
          # Fail the build if the native app or the web app didn't make it into the package, and
          # publish a summary as an annotation so it can be read without downloading the artifact.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $msix = Get-ChildItem AppPackages -Recurse -Include *.msix, *.appx |
            Where-Object { $_.Directory.Parent.Name -ne 'Dependencies' } | Select-Object -First 1
          if (-not $msix) { throw 'No package was produced.' }
          $zip = [IO.Compression.ZipFile]::OpenRead($msix.FullName)
          try {
            $entries = $zip.Entries | ForEach-Object { $_.FullName }
            $reader = New-Object IO.StreamReader(($zip.Entries | Where-Object FullName -eq 'AppxManifest.xml').Open())
            [xml]$manifest = $reader.ReadToEnd()
            $reader.Close()
            if ($manifest.Package.Identity.ProcessorArchitecture -ne 'x64') {
              throw "Expected an x64 MSIX, got $($manifest.Package.Identity.ProcessorArchitecture)."
            }
            $dependencies = $manifest.Package.Dependencies.PackageDependency | ForEach-Object { $_.Name }
          } finally { $zip.Dispose() }
          $webFiles = @($entries | Where-Object { $_ -like 'web/*' }).Count
          $sizeMb = [math]::Round($msix.Length / 1MB, 1)
          $summary = "$($msix.Name) ($sizeMb MB): native MediaPlayerElement, $webFiles web app files; depends on $($dependencies -join ', ')"
          "::notice title=Package (${{ matrix.configuration }})::$summary"
          # Managed DLLs are compiled into Nuvio.dll by .NET Native in Release, so only check native ones.
          $missing = @('web/index.html', 'web/js/main.js', 'web/css/app.css') | Where-Object { $entries -notcontains $_ }
          if ($missing) { throw "Missing from package: $($missing -join ', ')" }
          if ($dependencies -notcontains 'Microsoft.VCLibs.140.00') { throw 'Package does not depend on Microsoft.VCLibs.140.00 (needed by WebView2).' }
          Get-ChildItem AppPackages -Recurse -File | ForEach-Object { $_.FullName.Substring($PWD.Path.Length + 1) }

      - uses: actions/upload-artifact@v6
        with:
          name: Nuvio-Native-x64-${{ matrix.configuration }}
          path: AppPackages/
          if-no-files-found: error

      - name: Collect install files
        # Only what's needed to install: the app at the top, its x64 dependency packages in Dependencies.
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $test = Get-ChildItem AppPackages -Directory -Filter '*_Test' | Select-Object -First 1
          $app = @(Get-ChildItem $test.FullName -Filter *.msix)
          $dependencies = @(Get-ChildItem (Join-Path $test.FullName 'Dependencies\x64') -Filter *.appx)
          if ($app.Count -ne 1) {
            throw "Expected one app package, found: $(($app + $dependencies).Name -join ', ')"
          }
          New-Item -ItemType Directory release\Dependencies -Force | Out-Null
          $app | Copy-Item -Destination release
          $dependencies | Copy-Item -Destination release\Dependencies
          # The smoke-test job runs on another runner, so it cannot see this
          # run's cert: export the public cert with the package. It also lands
          # in the published release zip, where it helps manual PC installs.
          $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object Thumbprint -eq $env:CERT_THUMBPRINT
          Export-Certificate -Cert $cert -FilePath release\NuvioUWP.cer
          Get-ChildItem release -Recurse -File | ForEach-Object { $_.FullName.Substring($PWD.Path.Length + 1) }

      - uses: actions/upload-artifact@v6
        # The same layout as a release, for every build: download it from the run's Artifacts.
        if: matrix.configuration == 'Release'
        with:
          name: NuvioUWPVLC-x64
          path: release/
          if-no-files-found: error

      - name: Prepare release assets
        # The release ships two separate assets: the .msix on its own and the
        # Dependencies on their own (the .cer rides inside the Dependencies zip
        # for manual PC installs).
        if: github.event_name != 'pull_request' && matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $msix = Get-ChildItem release -Filter *.msix | Select-Object -First 1
          Copy-Item $msix.FullName NuvioUWPVLC-x64.msix
          Compress-Archive -Path release\Dependencies\*, release\NuvioUWP.cer -DestinationPath NuvioUWPVLC-Dependencies.zip
      - name: Publish release
        # Push a tag such as v1.0.0 to publish the Release build on the repository's Releases page.
        if: github.ref_type == 'tag' && matrix.configuration == 'Release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $parts = $env:PACKAGE_VERSION.Split('.')
          if ($tag -match '^v(\d+)\.(\d+)' -and "$($Matches[1]).$($Matches[2])" -ne "$($parts[0]).$($parts[1])") {
            throw "Tag $tag doesn't match version $($parts[0]).$($parts[1]) in Nuvio\Package.appxmanifest. Update the manifest's Version and tag again."
          }
          # The app reads "What's new" and "Package version" from these notes for its update notice.
          $changes = [regex]::Match((Get-Content CHANGELOG.md -Raw -Encoding utf8), '(?ms)^## ' + [regex]::Escape($tag) + '[ \t]*\r?\n(.*?)(?=^## |\z)')
          $notes = @("Nuvio for Xbox Developer Mode with FFmpegInteropX playback and a LibVLC fallback.", '')
          if ($changes.Success) { $notes += @("## What's new", $changes.Groups[1].Value.Trim(), '') }
          $notes += @(
            '## Install',
            'Download **NuvioUWPVLC-x64.msix** and **NuvioUWPVLC-Dependencies.zip**. Extract the Dependencies zip, then install the .msix with its dependencies.
            'Install steps are in the README: upload the .msix in the Xbox Device Portal, then add the files from Dependencies. Installing over an earlier version keeps your sign-in and data.',
            '',
            "Package version: $($parts[0..2] -join '.')")
          $notes -join "`n" | Set-Content release-notes.md -Encoding utf8
          Get-Content release-notes.md
          # Re-running the workflow (e.g. after adding a secret) updates the existing release.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag NuvioUWPVLC-x64.msix NuvioUWPVLC-Dependencies.zip --clobber
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            gh release edit $tag --notes-file release-notes.md
          } else {
            gh release create $tag NuvioUWPVLC-x64.msix NuvioUWPVLC-Dependencies.zip --title "Nuvio UWP VLC $tag" --notes-file release-notes.md
          }

      - name: Publish rolling pre-release
        # Every successful stage build (not a tag) updates one rolling
        # pre-release so there is always a direct download link. The .msix
        # and the Dependencies ship as separate assets.
        if: github.ref_type != 'tag' && github.event_name != 'pull_request' && matrix.configuration == 'Release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $notes = @(
            "Latest native-ui build (pre-release).",
            '',
            "Install: download NuvioUWPVLC-x64.msix and NuvioUWPVLC-Dependencies.zip, extract the zip, then install the .msix with its dependencies. NuvioUWP.cer (inside the Dependencies zip) is only needed for manual installs on a PC.",
            '',
            "Package version: $env:PACKAGE_VERSION",
            "Head: $env:GITHUB_SHA",
            "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID")
          $notes -join "`n" | Set-Content rolling-notes.md -Encoding utf8
          gh release view native-latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload native-latest NuvioUWPVLC-x64.msix NuvioUWPVLC-Dependencies.zip --clobber
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            gh release edit native-latest --notes-file rolling-notes.md --prerelease
          } else {
            gh release create native-latest NuvioUWPVLC-x64.msix NuvioUWPVLC-Dependencies.zip --title 'Nuvio Native (latest build)' --notes-file rolling-notes.md --prerelease
          }

  smoke:
    name: Smoke test (Release)
    needs: package
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: NuvioUWPVLC-x64
          path: smoke

      - name: Trust sideload certificate
        shell: pwsh
        run: |
          # Self-signed certs must be trusted before Add-AppxPackage accepts them
          # (Microsoft Learn: import the public .cer into CurrentUser\TrustedPeople).
          Import-Certificate -FilePath smoke\NuvioUWP.cer -CertStoreLocation Cert:\CurrentUser\TrustedPeople

      - name: Install and launch
        id: launch
        shell: powershell
        run: |
          $msix = Get-ChildItem smoke -Filter *.msix | Select-Object -First 1
          $deps = Get-ChildItem smoke\Dependencies -Filter *.appx
          if ($deps) { Add-AppxPackage -Path $msix.FullName -DependencyPath $deps.FullName }
          else { Add-AppxPackage -Path $msix.FullName }
          $pkg = Get-AppxPackage -Name b7f0f2ee-118a-4bad-88af-994615cd4212
          "PACKAGE_FAMILY_NAME=$($pkg.PackageFamilyName)" >> $env:GITHUB_ENV
          # Application Id "App" (Package.appxmanifest). A UWP app needs an
          # interactive session to activate; if this runner has none, Start-Process
          # throws and the launch checks are skipped (install still verified).
          try {
            Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!App"
            "LAUNCHED=true" >> $env:GITHUB_OUTPUT
          } catch {
            "::warning::Could not launch the app on this runner ($($_.Exception.Message)). Install verified only; launch checks skipped."
            "LAUNCHED=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          Start-Sleep -Seconds 10
          if (Get-Process -Name Nuvio -ErrorAction SilentlyContinue) { exit 0 }
          # Process never appeared: fail only on clear crash evidence in the log.
          $log = "$env:LOCALAPPDATA\Packages\$($pkg.PackageFamilyName)\LocalState\nuvio-vlc.log"
          if (Test-Path $log) {
            $fatal = Select-String -Path $log -Pattern 'Unhandled exception:|Main page failed to load'
            if ($fatal) {
              $fatal | ForEach-Object { "::error::$($_.Line)" }
              throw 'Smoke test failed: fatal error in the startup log (see matches above).'
            }
          }
          "::warning::App process never appeared after launch and the log shows no fatal error — ambiguous, not failing the build."
          "LAUNCHED=false" >> $env:GITHUB_OUTPUT

      - name: Check it stays alive and logs no fatal error
        if: steps.launch.outputs.LAUNCHED == 'true'
        shell: pwsh
        run: |
          Start-Sleep -Seconds 20
          $log = "$env:LOCALAPPDATA\Packages\$env:PACKAGE_FAMILY_NAME\LocalState\nuvio-vlc.log"
          if (-not (Get-Process -Name Nuvio -ErrorAction SilentlyContinue)) {
            throw 'Smoke test failed: the Nuvio process is gone 30s after launch (crashed on startup).'
          }
          if (-not (Test-Path $log)) {
            "::warning::Process is alive but no startup log was written."
            exit 0
          }
          # Fatal markers only: "Unhandled exception:" and "Main page failed to
          # load". Other Log.Error lines (stream/bridge failures) are non-fatal
          # and must not fail the build.
          $fatal = Select-String -Path $log -Pattern 'Unhandled exception:|Main page failed to load'
          if ($fatal) {
            $fatal | ForEach-Object { "::error::$($_.Line)" }
            throw 'Smoke test failed: fatal error in the startup log (see matches above).'
          }
          Get-Content $log -Tail 20
          'Smoke test passed: process alive after 30s, no fatal error in the log.'
